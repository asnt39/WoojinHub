<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b"><title>WoojinHub · 네 개의 게임, 하나의 공간</title>
  <link rel="icon" type="image/png" href="woojinhub-logo.png"><link rel="apple-touch-icon" href="woojinhub-logo.png">
  <style>
    :root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color-scheme:dark;color:#fafafa;background:#0b0b0b}
    *{box-sizing:border-box}
    body{margin:0;overflow:hidden}
    header{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:8px max(20px,3vw);background:#121212;border-bottom:1px solid #363636;box-shadow:0 4px 20px #0009;position:relative;z-index:4}
    .hub-brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
    .hub-logo{display:block;width:160px;height:54px;object-fit:contain;object-position:left center}
    .hub-brand small{color:#bdbdbd;display:block;font-size:9px;letter-spacing:.21em;font-weight:700}
    nav{display:flex;align-items:center;gap:6px;border-radius:10px;background:#080808;border:1px solid #383838;padding:4px;min-width:0}
    .hub-tab{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:7px;background:transparent;color:#bfbfbf;font-size:12px;white-space:nowrap;font-weight:680;padding:10px 12px;min-height:40px;cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .14s}
    .hub-tab .tab-index{color:#858585;font-size:10px;letter-spacing:.02em}
    .hub-tab:hover{background:#303030;color:#fff}
    .hub-tab:active{transform:scale(.97)}
    .hub-tab[aria-selected=true]{background:#ff9900;color:#111;border-color:#ffb447;box-shadow:inset 0 1px #fff6,0 2px 8px #0008}
    .hub-tab[aria-selected=true] .tab-index{color:#603b00}
    .hub-tab:focus-visible{outline:2px solid #ffbd63;outline-offset:3px}
    iframe{position:absolute;top:72px;left:0;width:100%;height:calc(100dvh - 72px);border:0;background:#101010}
    iframe[hidden]{display:none}
    #loading{position:absolute;inset:72px 0 0;display:grid;place-items:center;background:#0b0b0b;color:#ffae36;font-size:13px;letter-spacing:.08em}
    #loading[hidden]{display:none}
    @media(max-width:680px){header{height:66px;padding:6px 8px;gap:8px}.hub-brand{gap:3px}.hub-logo{width:97px;height:43px}.hub-brand small{display:none}nav{flex:1;justify-content:space-between;gap:1px}.hub-tab{padding:9px 5px;min-width:0;flex:1;font-size:10px}.hub-tab .tab-index{display:none}iframe{top:66px;height:calc(100dvh - 66px)}#loading{inset:66px 0 0}}
    @media(max-width:380px){.hub-logo{width:83px}.hub-tab{font-size:9px;padding:8px 2px}}
    @media(prefers-reduced-motion:reduce){.hub-tab{transition:none}}
  </style>
</head>
<body>
  <header><div class="hub-brand"><img class="hub-logo" src="woojinhub-logo.png" alt="WoojinHub 로고" width="160" height="54"><small>THE WOOJIN ARCADE</small></div>
    <nav role="tablist" aria-label="게임 선택">
      <button class="hub-tab" data-game="grow" role="tab" aria-selected="false"><span class="tab-index">01</span> 키우기</button>
      <button class="hub-tab" data-game="merge" role="tab" aria-selected="false"><span class="tab-index">02</span> 합치기</button>
      <button class="hub-tab" data-game="adventure" role="tab" aria-selected="false"><span class="tab-index">03</span> 우리오</button>
      <button class="hub-tab" data-game="city" role="tab" aria-selected="false"><span class="tab-index">04</span> GTW</button>
    </nav>
  </header>
  <div id="loading" role="status">게임을 준비하고 있어…</div>
  <script src="shell.js"></script>
</body>
</html>
