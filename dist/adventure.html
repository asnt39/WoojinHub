<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c2b"><title>우진의 모험</title><link rel="stylesheet" href="adventure.css"></head><body><main><header><div><small>WOOJIN ADVENTURE</small><h1>우진의 모험</h1></div><div class="tools"><button id="sound" aria-label="효과음">♪</button><button id="pause">일시정지</button><button id="retry">다시 도전</button></div></header><div class="hud"><span id="stageLabel"></span><span id="coins">◆ 0</span><span id="checkpoint">체크포인트 찾기</span></div><div class="viewport"><canvas id="world" width="960" height="540" tabindex="0" aria-label="우진의 모험. 방향키 또는 A D 이동, 스페이스 또는 위쪽 키 점프"></canvas><div id="panel" class="panel"><small>새로운 여행을 시작하자</small><h2 id="panelTitle">우진의 모험</h2><p id="panelText">다섯 개의 세계를 지나 빛나는 성에 도착해봐.<br>방향키 / A·D 이동 · SPACE / ↑ 점프<br>짧게 누르면 낮게, 길게 누르면 높게 점프해.</p><button id="play">모험 시작</button></div></div><div class="touch"><div><button data-key="left" aria-label="왼쪽">◀</button><button data-key="right" aria-label="오른쪽">▶</button></div><button class="jump" data-key="jump">점프 ↗</button></div><nav id="stages" aria-label="스테이지 선택"></nav><p class="tip">점프 직전 입력과 발판 끝의 작은 실수를 보정해줘. ◆ 빛 조각을 모으고 깃발에서 진행을 저장해!</p></main><script src="adventure.js"></script><script src="child-nav.js"></script></body></html>
