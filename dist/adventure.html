<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111c2b"><title>우리오 · WoojinHub</title>
<link rel="stylesheet" href="adventure.css"><link rel="stylesheet" href="arcade-ui.css"><link rel="stylesheet" href="woorio-polish.css"><link rel="stylesheet" href="woorio-arcade.css"><link rel="stylesheet" href="woorio-mobile.css"></head>
<body class="game-adventure">
<main>
  <header><div><small>WOOJIN ADVENTURE · ARCADE MODE</small><h1>우리오 <span class="title-accent">PIXEL QUEST</span></h1></div>
    <div class="tools"><button id="settings" aria-label="설정">⚙ 설정</button><button id="fullscreen" aria-label="전체화면">⛶</button><button id="music" aria-label="배경음악 켜기 끄기" aria-pressed="true">BGM ON</button><button id="sound" aria-label="효과음" title="효과음">♪</button><button id="pause">Ⅱ 일시정지</button><button id="retry">↻ 다시 도전</button></div>
  </header>
  <div class="hud"><span id="stageLabel"></span><span id="coins">◆ 0</span><span id="checkpoint">체크포인트 찾기</span></div>
  <div id="notice" class="notice-shelf" role="status" aria-live="polite"></div>
  <div class="viewport">
  <div class="ability-bar" id="abilityBar" hidden><span id="power"></span><div id="powerGauge" class="power-gauge" hidden aria-label="능력 지속 시간"><div id="powerFill" class="power-fill"></div></div></div>
  <div id="bossHealth" class="boss-health" hidden aria-live="polite"><span id="bossHpText">성벽의 수호자</span><div class="boss-track"><div id="bossHp" class="boss-fill"></div></div></div>

    <canvas id="world" width="960" height="540" tabindex="0" aria-label="우리오. 방향키 또는 A D 이동, 스페이스 또는 위쪽 키 점프"></canvas>
    <div id="deathCurtain" class="death-curtain" hidden aria-live="polite"><strong>다시 도전!</strong><small id="deathReturn">CHECKPOINT</small></div>
    <div id="panel" class="panel"><small>NEW ADVENTURE</small><h2 id="panelTitle">우리오</h2>
      <p id="panelText">우진이와 두부의 아홉 세계 모험! 3·6·9 스테이지에는 서로 다른 보스가 기다려.<br>방향키 / A·D 이동 · SPACE / ↑ 점프 (날개신발은 공중 한 번 더)<br>상자를 아래에서 두드려 거대화 · 불꽃 · 두부 · 날개신발 · 방패를 만나!</p>
      <button id="play">▶ 모험 시작</button>
    </div>
  </div>
  <div class="touch" aria-label="모바일 조작">
    <div class="touch-move">
      <button data-key="left" aria-label="왼쪽"></button>
      <button data-key="right" aria-label="오른쪽"></button>
    </div>
    <button id="fireControl" data-key="fire" class="fire" aria-label="불꽃 발사" aria-disabled="true"></button>
    <button class="jump" data-key="jump" aria-label="점프"></button>
  </div>
  <details id="stageMenu"><summary>스테이지 선택</summary><nav id="stages" aria-label="스테이지 선택"></nav></details>
<div id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-label="우리오 설정" hidden><section><h2>게임 설정</h2><label><input id="settingSound" type="checkbox" checked> 효과음</label><label><input id="settingMusic" type="checkbox" checked> 배경음악</label><button id="closeSettings">게임으로 돌아가기</button></section></div></main>
<script src="pixel-art.js"></script><script src="woorio-audio.js"></script><script src="adventure.js"></script><script src="child-nav.js"></script>
</body></html>
